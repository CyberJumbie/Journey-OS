# .context/components.yaml
# Prototype has 89 components. Track only components WIRED to real backends here.
# Format: "Name: type [variants] — used_in:ScreenName — status"
# status: mock (still on setTimeout) | wired (connected to real API) | rewrite (CopilotKit)
# Updated by /compound as screens are wired.

# ── Scaffold (P1-001) ────────────────────────────────────────────────────────
ImageWithFallback: atom [] — used_in:Sidebar — wired
Sidebar: organism [faculty nav, collapsible] — used_in:DashboardTemplate — wired
AdminSidebar: organism [admin nav] — used_in:AdminDashboardTemplate — wired
TopBar: organism [search, breadcrumb, avatar] — used_in:DashboardTemplate — wired
TopNavigation: organism [top nav bar] — used_in:pages — wired
DashboardTemplate: template [sidebar+topbar+main] — used_in:faculty pages — wired
AdminDashboardTemplate: template [admin sidebar+main] — used_in:admin pages — wired

# ── Auth (P1-024) ─────────────────────────────────────────────────────────────
LoginPage: page [email+password] — used_in:app/(auth)/login — wired
RegisterPage: page [faculty registration] — used_in:app/(auth)/register/faculty — wired
AuthMiddleware: middleware [JWT validate, req.user] — used_in:backend routes — wired

# ── Course Selection (P1-025) ─────────────────────────────────────────────────
CourseStats: molecule [3 stat cards] — used_in:CoursesPage — wired
CourseGrid: organism [clickable cards, navigate to workbench] — used_in:CoursesPage — wired

# ── Upload (P1-009) ───────────────────────────────────────────────────────────
# UploadZone: form [idle, uploading, done, error] — used_in:UploadSyllabusPage — mock
# ProcessingStatus: display [pending, processing, complete, failed] — used_in:ProcessingStatusPage — mock

# ── Concept Review ────────────────────────────────────────────────────────────
# ConceptCard: display [pending, approved, rejected] — used_in:ConceptReviewPage — mock
# ConceptReviewList: list [] — used_in:ConceptReviewPage — mock

# ── QuestWorkbench (P1-026/027 — REWRITE) ────────────────────────────────────
QuestWorkbench: organism [wires ChatPanel+PreviewPanel] — used_in:WorkbenchPage — wired
ChatPanel: organism [CopilotChat+useCopilotReadable] — used_in:QuestWorkbench — wired
QuestionPreviewPanel: organism [useCoAgent streaming state] — used_in:QuestWorkbench — wired
StreamingText: atom [append-only DOM, no flicker] — used_in:QuestionPreviewPanel — wired
OptionRow: molecule [label badge+text+rationale] — used_in:QuestionPreviewPanel — wired
ValidationBadge: atom [pass/fail rule] — used_in:ValidationSummary — wired
ValidationSummary: molecule [list of ValidationBadges] — used_in:QuestionPreviewPanel — wired
WorkbenchTemplate: template [45/55 split-pane] — used_in:WorkbenchPage — wired

# ── Approve/Reject (P1-028) ──────────────────────────────────────────────────
ApproveRejectBar: molecule [approve+reject buttons, callbacks from parent] — used_in:QuestionPreviewPanel — wired

# ── Question Bank (P1-029) ────────────────────────────────────────────────────
QuestionTable: organism [sortable, filterable, paginated] — used_in:ItemsPage — wired
QuestionRow: molecule [truncated vignette+stem, expandable] — used_in:QuestionTable — wired
FilterBar: organism [course+status dropdowns] — used_in:QuestionTable — wired

# ── Dashboards (DEMO epic) ──────────────────────────────────────────────────
AdminDashboard: page [KPIs, users, dept stats, alerts] — used_in:app/(admin)/admin — wired
FacultyDashboard: page [courses, activity, metrics] — used_in:app/(faculty-portal)/faculty/dashboard — wired
StudentDashboard: page [courses, KPIs, user info] — used_in:app/(student)/student-dashboard — wired
InstitutionDashboard: page [KPIs, user info] — used_in:app/(institution)/institution/dashboard — wired
CoverageDashboard: page [USMLE coverage items] — used_in:app/(institution)/institution/coverage — wired

# ── Auth Context ────────────────────────────────────────────────────────────
useCurrentUser: hook [id, email, displayName, initials, role, institutionId] — used_in:sidebars+navs+pages — wired

# NOTE: Uncomment + change status to "wired" when story implementing it is done.
