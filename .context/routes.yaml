# .context/routes.yaml
# One-liner per route. Updated by /compound as routes are added.
# Format: "METHOD /path — description [auth:role]"
# MAX 60 lines.
# Populated incrementally — only routes that have been BUILT appear here.
# (Session 0 baseline — no routes built yet)

# ── Auth ──────────────────────────────────────────────────────────────────────
POST /api/v1/auth/login — Supabase signInWithPassword, returns JWT + user profile [public]
POST /api/v1/auth/register — Create faculty user + profile, returns JWT [public]
GET  /api/v1/auth/me — Current user profile + role [auth:any]

# ── Health ────────────────────────────────────────────────────────────────────
GET  /api/v1/health — DB connectivity check, returns { status, neo4j, supabase, version, timestamp } [public]

# ── Courses ───────────────────────────────────────────────────────────────────
GET  /api/v1/courses — List courses with subconcept_count + item_count [auth:faculty|admin]
# GET  /api/v1/courses/:id — Single course with sections [auth:faculty|admin]

# ── Uploads ───────────────────────────────────────────────────────────────────
POST /api/v1/uploads — Upload PDF to Supabase Storage, create Upload record [auth:faculty] (multer, 50MB, PDF only)
POST /api/v1/uploads/:id/parse — Trigger full ingestion pipeline (parse→chunk→classify→embed→extract→align) [auth:faculty]
GET  /api/v1/uploads/:id — Upload status + processing progress [auth:faculty]

# ── Content Chunks ────────────────────────────────────────────────────────────
# GET  /api/v1/chunks?courseId=X — List chunks for a course [auth:faculty|admin]
# GET  /api/v1/chunks/:id — Single chunk with embedding metadata [auth:faculty|admin]

# ── Assessment Items ──────────────────────────────────────────────────────────
# POST /api/v1/items — Generate item via pipeline (streams via SSE) [auth:faculty]
# GET  /api/v1/items/:id — Single item with options [auth:faculty|admin]
PATCH /api/v1/items/:id — Update status (approved|rejected) via DualWriteService [auth:faculty]
GET  /api/v1/items?courseId=X&status=Y&page=N&limit=20 — Paginated item bank query [auth:faculty|admin]

# ── Generation Pipeline ───────────────────────────────────────────────────────
# POST /api/v1/generate — Start pipeline, returns SSE stream [auth:faculty]

