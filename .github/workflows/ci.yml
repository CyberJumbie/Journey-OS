name: CI / CD

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [dev, main]

# ──────────────────────────────────────────────────────────────────────────────
# ENVIRONMENT STRATEGY
# ──────────────────────────────────────────────────────────────────────────────
# local   → developer machine (pnpm dev). Used during implementation + /verify.
# dev     → Vercel Preview. Auto-deploys on every push to dev branch.
#           Used to test completed features and epics before production.
#           URL: journey-os-dev.vercel.app (or preview URL from Vercel)
# production → Vercel Production. CD on every push to main (merge from dev).
#           URL: journey-os.vercel.app (production domain)
# ──────────────────────────────────────────────────────────────────────────────

jobs:
  # ── Job 1: Validate every PR and push ──────────────────────────────────────
  validate:
    name: Lint + Type Check + Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint + Type Check + Build
        # turbo.json task names: lint, type-check (hyphenated), build
        # package.json script: pnpm run typecheck (maps to turbo type-check)
        run: turbo lint type-check build

  # ── Job 2: Deploy to dev environment (auto on push to dev) ─────────────────
  deploy-dev:
    name: Deploy → Dev
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'

    environment:
      name: dev
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: turbo build

      - name: Deploy to Vercel (dev preview)
        id: deploy
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          scope: ${{ secrets.VERCEL_ORG_ID }}
          # No --prod flag = preview/dev deployment
          alias-domains: journey-os-dev.vercel.app

      - name: Dev smoke check
        run: |
          DEV_URL="${{ steps.deploy.outputs.preview-url }}"
          echo "Dev deployed to: $DEV_URL"

          # Health check
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$DEV_URL/api/health")
          if [ "$STATUS" != "200" ]; then
            echo "❌ Health check failed: HTTP $STATUS"
            exit 1
          fi

          # Version check
          VERSION=$(curl -s "$DEV_URL/api/health" | jq -r '.version')
          echo "✅ Dev health OK — version: $VERSION"

  # ── Job 3: Deploy to production (CD on push to main) ───────────────────────
  deploy-production:
    name: Deploy → Production
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    environment:
      name: production
      url: https://journey-os.vercel.app

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: turbo build

      - name: Deploy to Vercel (production)
        id: deploy
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          scope: ${{ secrets.VERCEL_ORG_ID }}

      - name: Production smoke check
        run: |
          PROD_URL="https://journey-os.vercel.app"
          echo "Checking production: $PROD_URL"

          # Health check
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$PROD_URL/api/health")
          if [ "$STATUS" != "200" ]; then
            echo "❌ Production health check failed: HTTP $STATUS"
            exit 1
          fi

          # Version
          VERSION=$(curl -s "$PROD_URL/api/health" | jq -r '.version')
          COMMIT="${{ github.sha }}"
          echo "✅ Production OK — version: $VERSION — commit: ${COMMIT:0:7}"

      - name: Auto-rollback on smoke failure
        if: failure()
        run: |
          echo "❌ Production smoke failed — rolling back"
          # Vercel auto-keeps previous deployment
          # The rollback is done via /restore command if needed
          # Open incident issue
          gh issue create \
            --title "🚨 Auto-rollback triggered: production deploy failed" \
            --body "Commit: ${{ github.sha }}
          
          Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          
          Production smoke check failed after deploy. Previous deployment is still live.
          Investigate before re-deploying."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Job 4: Block PRs to main from anything other than dev ──────────────────
  protect-main:
    name: Guard main branch
    runs-on: ubuntu-latest
    if: github.base_ref == 'main' && github.event_name == 'pull_request'

    steps:
      - name: Verify source is dev
        run: |
          if [ "${{ github.head_ref }}" != "dev" ]; then
            echo "❌ PRs to main must come from dev branch — not ${{ github.head_ref }}"
            echo "Merge your changes to dev first, validate in dev environment, then open a PR dev → main."
            exit 1
          fi
          echo "✅ PR from dev → main — allowed"

  # ── Job 5: Neo4j graph validation on server changes ────────────────────────
  validate-graph:
    name: Graph Validation
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Check for server/seeder changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            server:
              - 'backend/**'
              - 'seeder/**'
              - 'scripts/**'

      - name: Validate graph (if server/seeder changed)
        if: steps.changes.outputs.server == 'true'
        env:
          NEO4J_URI: ${{ secrets.NEO4J_URI }}
          NEO4J_USER: ${{ secrets.NEO4J_USER }}
          NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
        run: |
          npx ts-node scripts/validate-graph.ts --layer=1 || echo "Layer 1 not seeded yet — OK for early stories"
