name: CI / CD

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [dev, main]

# ──────────────────────────────────────────────────────────────────────────────
# ENVIRONMENT STRATEGY
# ──────────────────────────────────────────────────────────────────────────────
# local      → developer machine (pnpm dev). frontend:3000, backend:3001.
# dev        → Auto-deploys on push to dev branch.
#              Frontend → Vercel Preview (journey-os-dev.vercel.app)
#              Backend  → Railway Dev (journey-os-dev.up.railway.app)
# production → CD on push to main (merge from dev).
#              Frontend → Vercel Production (journey-os.vercel.app)
#              Backend  → Railway Production (journey-os.up.railway.app)
# ──────────────────────────────────────────────────────────────────────────────

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Job 1: Validate every PR and push ──────────────────────────────────────
  validate:
    name: Lint + Type Check + Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint + Type Check + Build
        run: turbo lint type-check build

  # ── Job 2: Deploy frontend to Vercel (dev) ─────────────────────────────────
  deploy-frontend-dev:
    name: Frontend → Vercel Dev
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'

    environment:
      name: dev
      url: ${{ steps.deploy.outputs.preview-url }}

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Vercel (preview)
        id: deploy
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          scope: ${{ secrets.VERCEL_ORG_ID }}
          alias-domains: journey-os-dev.vercel.app

  # ── Job 3: Deploy backend to Railway (dev) ─────────────────────────────────
  deploy-backend-dev:
    name: Backend → Railway Dev
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'

    environment:
      name: dev-backend

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Railway (dev)
        uses: bervProject/railway-deploy@main
        with:
          railway_token: ${{ secrets.RAILWAY_TOKEN }}
          service: ${{ secrets.RAILWAY_SERVICE_DEV }}

  # ── Job 4: Deploy frontend to Vercel (production) ─────────────────────────
  deploy-frontend-prod:
    name: Frontend → Vercel Production
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    environment:
      name: production
      url: https://journey-os.vercel.app

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Vercel (production)
        id: deploy
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          scope: ${{ secrets.VERCEL_ORG_ID }}

  # ── Job 5: Deploy backend to Railway (production) ──────────────────────────
  deploy-backend-prod:
    name: Backend → Railway Production
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    environment:
      name: production-backend

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Railway (production)
        uses: bervProject/railway-deploy@main
        with:
          railway_token: ${{ secrets.RAILWAY_TOKEN }}
          service: ${{ secrets.RAILWAY_SERVICE_PROD }}

  # ── Job 6: Smoke check after deploy ────────────────────────────────────────
  smoke-check-dev:
    name: Dev Smoke Check
    runs-on: ubuntu-latest
    needs: [deploy-frontend-dev, deploy-backend-dev]
    if: github.ref == 'refs/heads/dev'

    steps:
      - name: Wait for services to stabilize
        run: sleep 30

      - name: Backend health check
        run: |
          BACKEND_URL="${{ secrets.DEV_BACKEND_URL }}"
          if [ -z "$BACKEND_URL" ]; then
            echo "⚠ DEV_BACKEND_URL not set — skipping"
            exit 0
          fi
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$BACKEND_URL/api/v1/health" --max-time 10)
          echo "Backend health: HTTP $STATUS"
          [ "$STATUS" = "200" ] || echo "⚠ Backend not responding yet (may still be starting)"

  smoke-check-prod:
    name: Production Smoke Check
    runs-on: ubuntu-latest
    needs: [deploy-frontend-prod, deploy-backend-prod]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Wait for services to stabilize
        run: sleep 30

      - name: Production health check
        run: |
          BACKEND_URL="${{ secrets.PROD_BACKEND_URL }}"
          if [ -z "$BACKEND_URL" ]; then
            echo "⚠ PROD_BACKEND_URL not set — skipping"
            exit 0
          fi
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$BACKEND_URL/api/v1/health" --max-time 10)
          if [ "$STATUS" != "200" ]; then
            echo "❌ Production health check failed: HTTP $STATUS"
            exit 1
          fi
          echo "✅ Production health OK"

      - name: Auto-rollback on failure
        if: failure()
        run: |
          gh issue create \
            --title "Production deploy smoke check failed" \
            --body "Commit: ${{ github.sha }}
          Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          Production smoke check failed. Previous deployment is still live on Railway/Vercel.
          Investigate before re-deploying."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Job 7: Block PRs to main from anything other than dev ──────────────────
  protect-main:
    name: Guard main branch
    runs-on: ubuntu-latest
    if: github.base_ref == 'main' && github.event_name == 'pull_request'

    steps:
      - name: Verify source is dev
        run: |
          if [ "${{ github.head_ref }}" != "dev" ]; then
            echo "❌ PRs to main must come from dev branch — not ${{ github.head_ref }}"
            echo "Merge your changes to dev first, validate, then PR dev → main."
            exit 1
          fi
          echo "✅ PR from dev → main — allowed"
